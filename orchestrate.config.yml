# orchestrate.config.yml: settings for Agent-kit's orchestrate skill.
#
# The keys below are the answers confirmed on 2026-11-19 for the run on
# #280 and #281. Comments are context for the next run. The checker refuses
# an unknown key, so a fact that is not a key stays a comment.
#
# Harness. This repository is developed in Cursor. Support Level is tried
# (.claude/skills/orchestrate/harnesses/cursor.md). harness is left unset so
# the run still detects it. Pin it only after a run is recorded as verified.
#
# Which copy. Cursor can load ~/.claude/skills/orchestrate and this
# repository's .claude/skills/orchestrate. The first command of a run is
# `node .claude/skills/orchestrate/config.mjs where orchestrate`. use: repository
# means stop and follow the SKILL.md that load names.
#
# message reaches a building sub-agent only after it has ended:
# "Resume agent <id>". A Ruling made while it is running stays in the
# Decision Requests cell until that message is sent. An in-progress diff is
# not delivery.
#
# The heartbeat on Cursor is a foreground watch. A turn cut by a human
# message or by compaction still lets an in-flight watch append the activity
# log, including a line whose time is earlier than the line above it. A late
# line is not a new event.
#
# Scenarios a QA Delegation leaves for a person are run by the human, or by
# resuming that QA Delegation. The Chief of Staff does not start the QA Stack
# to drive them. Driver facts for this API and this web app are in qa.config.yml.
#
# Writes. gh pr edit fails on this repository's classic Projects field. Add a
# label and edit a pull-request body with gh api. routes.merge is unset: the
# close-out prints no merge command, and the skill never merges.
#
# Team Run (`/orchestrate --spec <n> --team`). Setup and how-to:
# docs/agents/agent-kit.md#orchestrate-team-run.
#
# Teammates. The skill has no member list: a ticket belongs to the one
# person assigned to it on GitHub, and each teammate runs their own Chief of
# Staff, as the gh login it reads with `gh api user`. Today that is
# mnaimfaizy (owner) and naimfaizy-bot (the bot PC's login; write access,
# assignable). TODO(Naim): any other teammate needs write access to be
# assigned, and their own clone and gh login; nothing in this file changes.
#
# Spec shape. A Team Run plans only a spec whose tickets are GitHub
# sub-issues of the spec issue, each with exactly one assignee. Blocking
# edges are GitHub's issue dependencies ("blocked by").
#
# State labels. The six `team.labels` must exist before the first Team Run;
# the run otherwise asks to create them as the human (a Decision Request).
# The gh label create commands are in docs/agents/agent-kit.md.
#
# set-state. trackers/github.md writes the state label with gh issue edit,
# which reads the same classic Projects field: on 2026-11-19, gh 2.104.0,
# `gh issue view --json projectCards` failed here with "Projects (classic)
# is being deprecated". If gh issue edit fails the same way, write the label
# with gh api instead (POST repos/mnaimfaizy/fastapi_rbac/issues/<n>/labels
# -f "labels[]=<new>", then DELETE .../issues/<n>/labels/<old>, URL-encoded),
# and read the labels back as set-state says.
#
# This repository is public: Shared Board rows and state labels are
# readable by anyone. Briefs, reports and the Ruling Ledger stay in run_dir.

run_dir: tmp/orchestrate

read_first:
  - AGENTS.md
  - docs/agents/domain.md
  - docs/agents/commit-messages.md
  - docs/agents/branch-names.md
  - docs/reference/architecture.md
  - docs/contributing.md

routes:
  commit: "Conventional Commits per docs/agents/commit-messages.md (type(scope): subject, no emoji, one logical change). Commit only through the commit-change skill, which runs `bash scripts/development/commit-runner.sh --message-file <path>`; never plain `git commit`. Branch names per docs/agents/branch-names.md."
  pull_request: "Open and update pull requests only through the create-pull-request skill, which runs `bash scripts/development/pr-runner.sh ... --draft`; never plain gh pr create, gh pr edit or git push. The body lists Fixes and the issue number under Issues, as .github/instructions/resolve-issue.instructions.md requires. See docs/agents/pr-pipeline.md."

regate:
  - 'cd backend && uv run --no-project --python 3.10 --with-requirements requirements.txt --with "python-dotenv[cli]" dotenv -f .env.test.example run -- pytest test/unit/ test/api/ -q -p no:cacheprovider'
  - "cd react-frontend && npm ci --no-audit --no-fund && npx vitest run"

ready_to_merge:
  qa: report

# Read only by a Team Run. Pinned rather than detected, so a fork or a second
# remote never changes where the board is written. A disagreement with
# origin's host is asked about, never chosen silently.
tracker: github

team:
  labels: # the agent-kit defaults, written out so the label commands match
    planned: "team: planned" # in the plan, not started
    parked: "team: parked" # waiting for a blocker's pull request to merge
    running: "team: running" # its Delegation is working
    waiting: "team: waiting" # waiting on a decision
    ready_to_merge: "team: ready to merge" # Ready to Merge
    merged: "team: merged" # its pull request is merged
  recent_activity: 5 # milestones a Shared Board row keeps in its Recent activity list
