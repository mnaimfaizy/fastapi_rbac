# Hub runtime SPLIT — Celery worker + Beat (no Postgres/Redis/API).
# Usage (from this directory, after .env is ready):
#   ./bootstrap-worker.sh
#   # or: docker compose --env-file .env -f compose.worker.yml up -d
#
# Use the same .env values as the API VM for DATABASE_* / REDIS_* / CELERY_*.
# Stop this VM in OCI when you are not testing.

name: fastapi-rbac-hub-worker

services:
  worker:
    image: mnaimfaizy/fastapi-rbac-worker:${IMAGE_TAG:-v1.2.3}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODE: production
      PYTHONPATH: /app
    volumes:
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/app/certs/ca.crt:ro
    # 1 GB micro: lower concurrency than the image default (2).
    command:
      [
        "/bin/bash",
        "-c",
        "export PYTHONPATH=/app && python ./app/backend_pre_start.py && exec celery -A app.worker:celery_app worker --loglevel=info -Q emails,maintenance,logging,user_management,default,periodic_tasks --concurrency=1",
      ]
    networks:
      - hub_worker

  beat:
    image: mnaimfaizy/fastapi-rbac-worker:${IMAGE_TAG:-v1.2.3}
    restart: unless-stopped
    # Named volumes are root-owned; image USER is appuser (uid 1000). Start as
    # root only long enough to chown the schedule dir, then drop privileges.
    user: "0:0"
    env_file:
      - .env
    environment:
      MODE: production
      CELERY_BEAT_SCHEDULER: celery.beat:PersistentScheduler
      PYTHONPATH: /app
    volumes:
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/app/certs/ca.crt:ro
      - beat_schedule:/var/lib/celery
    command:
      [
        "/bin/bash",
        "-c",
        "set -euo pipefail && mkdir -p /var/lib/celery && chown -R appuser:appuser /var/lib/celery && exec runuser -u appuser -- env PYTHONPATH=/app bash -c 'python ./app/backend_pre_start.py && exec celery -A app.worker:celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule.db'",
      ]
    depends_on:
      worker:
        condition: service_started
    networks:
      - hub_worker

volumes:
  beat_schedule:

networks:
  hub_worker:
    driver: bridge
