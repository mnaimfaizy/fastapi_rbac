# React Frontend Development Docker Compose
# Optimized for development with hot-reload and debugging

services:
  react_frontend_dev:
    build:
      context: ${REACT_FRONTEND_SRC:-.}
      dockerfile: Dockerfile
      target: development
      args:
        - NODE_ENV=development
    image: react_frontend_dev:dev
    container_name: react_frontend_dev
    environment:
      - NODE_ENV=development
      # Vite's file watcher gets no filesystem events through the bind mount
      # below, so without polling it serves the transform it cached at startup
      # and edits to existing files never reach the browser -- the "hot-reload"
      # this file promises silently does not happen.
      - VITE_USE_POLLING=true
    env_file:
      - .env.development
    ports:
      - '3000:5173' # Vite dev server default port
    volumes:
      - ${REACT_FRONTEND_SRC:-.}:/app
      - /app/node_modules # Exclude node_modules from bind mount
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0']
    networks:
      - fastapi_rbac_dev_network
    restart: on-failure
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:5173',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fastapi_rbac_dev_network:
    name: fastapi_rbac_dev_network
    driver: bridge
    external: true
