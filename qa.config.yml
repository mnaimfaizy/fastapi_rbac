# qa.config.yml: settings for Agent-kit's qa-plan and manual-qa skills (#318).
#
# Consumer-owned (not Kit-owned): upgrades never touch it. Keys and rules:
# .claude/skills/qa-plan/ADAPTER.md and .claude/skills/manual-qa/ADAPTER.md.
# The skills read a YAML subset: no tabs, anchors or multi-line values.
# Never put a password, token or hosted address in this file.
#
# plan.suites mirror CI's Backend Test job and the unit-test step of the
# Frontend Checks job. qa-plan runs each at the head and in a tracked-files-only
# worktree at the merge-base, in cmd.exe on Windows and /bin/sh elsewhere, so
# each command installs what it needs and reads the same in both shells. The
# backend suite loads the throwaway test settings from the tracked
# backend/.env.test.example through python-dotenv's CLI, the parser the app
# itself uses (uv's --env-file misreads BACKEND_CORS_ORIGINS=["*"]); tests use
# in-memory SQLite.
#
# The QA Plan and the QA Report both go on the pull request as one comment
# each, and only after the person running the skill says yes.
#
# The QA Stack is the dev compose stack plus backend/docker-compose.qa.yml
# (ACCOUNT_LOCKOUT_MINUTES=5, MAX_LOGIN_ATTEMPTS=3). scripts/qa/prepare-stack.mjs
# copies missing dev env files from the main checkout and creates the network.
# migrate and seed run inside the backend container, whose database host is
# fastapi_rbac_db_dev, one of the hosts the seeder accepts as local.
# QA Stack and QA Accounts: docs/reference/qa-accounts.md
#
# Context from the 2026-11-19 run on pull request 403. These are comments:
# the checker refuses an unknown key, and a comment does not change a run.
#
# Agent-kit v1.0.0-beta.11 (QA Plans are format=4; re-plan older plans).
#
# run.surface lists [api, web]: QA here covers both the API and the UI. Each
# scenario still drives one Surface, and a promise that needs both is planned
# as two scenarios (agent-kit ADR 0045); a mixed-Surface scenario is refused.
# A multi-session MP4 now cuts between Sessions in Scenes (a scenario's
# **Story:**), so it shows the other person too.
#
# API. Mutating routes need X-CSRF-Token set to the unsigned token in
# data.csrf_token from GET /api/v1/auth/csrf-token. The fastapi-csrf-token
# cookie is the signed token and is HttpOnly (backend/app/api/v1/endpoints/auth.py,
# get_csrf_token). http.mjs sends it with {{cookie:name}} and copies the
# body's token into the next request with {{json:<n>:data.csrf_token}}, so an
# api scenario can drive a mutating call. POST /api/v1/auth/login is limited
# to 5/minute (auth.py). A 429 with Retry-After of 60 seconds or less retries
# the scenario once; a longer wait leaves it for a person. Plan sign-ins so a
# run stays under the limit.
#
# Web. run.playwright points web.mjs, storyboard.mjs and mp4.mjs at
# react-frontend/package.json, where Playwright is installed; evidence paths
# stay relative to the repository root. The page origin is
# http://localhost:3000 (run.stack.address, since `up` prints none). The CSRF
# cookie is SameSite=lax, and a document on 127.0.0.1 is a different site
# from localhost, so the cookie is not sent. The API is published on
# http://127.0.0.1:8000 and http://localhost:8000. web.mjs blocks a document
# navigation that leaves the page origin; an XHR to the API on the same host
# is allowed.
#
# Machine-local defaults, not keys: on the bot PC the QA Stack's ports are
# bound to 127.0.0.1 through local compose overrides, scenarios run in
# parallel on up to 4 CPUs with short waits (web.mjs waits default to 5 s).
#
# report.places tags each item a posted QA Report leaves for a person. There
# is no staging environment, so the Places are local and production; only
# local holds a merge, and production items are deferred to release checks.

working_dir: tmp/qa # gitignored

plan:
  base_ref: origin/main
  suites:
    - name: backend
      command: 'cd backend && uv run --no-project --python 3.10 --with-requirements requirements.txt --with "python-dotenv[cli]" dotenv -f .env.test.example run -- pytest test/unit/ test/api/ -q -p no:cacheprovider --junitxml=../tmp/qa/junit/backend.xml'
      junit: tmp/qa/junit/backend.xml
      surfaces: ["backend/**"]
    - name: frontend
      command: "cd react-frontend && npm ci --no-audit --no-fund && npx vitest run --reporter=junit --outputFile=../tmp/qa/junit/frontend.xml"
      junit: tmp/qa/junit/frontend.xml
      surfaces: ["react-frontend/**"]
  publish:
    - default: true
      to: pr-comment
  tracker: github

run:
  target: stack
  surface: [api, web]
  playwright: react-frontend
  stack:
    up: "node scripts/qa/prepare-stack.mjs && docker compose -f backend/docker-compose.dev.yml -f backend/docker-compose.qa.yml up -d --wait fastapi_rbac_dev && docker compose -f react-frontend/docker-compose.dev.yml up -d --wait"
    migrate: "docker exec fastapi_rbac_dev alembic upgrade head"
    seed: "docker exec fastapi_rbac_dev python app/initial_data.py && docker exec fastapi_rbac_dev python -m app.qa_accounts seed"
    down: "docker compose -f react-frontend/docker-compose.dev.yml down && docker compose -f backend/docker-compose.dev.yml -f backend/docker-compose.qa.yml down"
    address: http://localhost:3000
  accounts:
    print: "docker exec fastapi_rbac_dev python -m app.qa_accounts print"
    restore: "docker exec fastapi_rbac_dev python -m app.qa_accounts seed --restore --account {id}"
    roles:
      - id: admin
        purpose: "holds every permission: manages users, roles, permissions and their groups"
      - id: manager
        purpose: "creates, reads and updates users and content; can read roles and permissions only"
      - id: user
        purpose: "an ordinary user who manages only their own profile"
  evidence:
    upload: none

report:
  places: [local, production]
  holds: [local]
