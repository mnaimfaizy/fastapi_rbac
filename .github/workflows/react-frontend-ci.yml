name: React Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's run still in progress. Pushes
# to main get a group of their own (the run id), so they never queue behind
# or cancel each other (#381).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22.x"

defaults:
  run:
    working-directory: ./react-frontend

jobs:
  # Skips the jobs below when the change cannot affect the frontend (#381). A job
  # skipped by `if` reports Success, so the required checks still resolve on
  # a docs-only PR. If this job fails, everything runs instead (fail open).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: detect
        uses: ./.github/actions/detect-changes

  lint:
    name: Frontend Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

  format_check:
    name: Frontend Format Check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, format_check]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.format_check.result == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

  # Vitest unit/component tests. These need no backend stack, unlike the
  # Playwright E2E job below, so they run on every PR.
  unit_tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, format_check]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.format_check.result == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Report exactly one file. `files` alone only adds to the action's
          # directory search, which otherwise also picks up other reporters'
          # output and uploads the same coverage twice.
          files: ./react-frontend/coverage/lcov.info
          disable_search: true
          # Flagged so frontend and backend stay separate numbers. A single
          # percentage blended across TypeScript and Python means nothing.
          flags: frontend
          fail_ci_if_error: true
          verbose: true

  # Playwright E2E requires a live FastAPI backend (Postgres, Redis, seeded admin,
  # CSRF-aware login). Image tags are aligned with compose/CI services (#37), but this
  # job still does not start the backend stack. Keep skipped until a dedicated
  # full-stack E2E workflow is added (follow-up under #30).
  e2e-tests:
    name: Frontend E2E Tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: react-frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: react-frontend/test-results/
          retention-days: 30
