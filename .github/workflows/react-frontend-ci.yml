name: React Frontend CI

# Called by ci.yml when a change touches the frontend (#381); it has no
# trigger of its own. Run the whole pipeline by hand from CI > Run workflow.
on:
  workflow_call:

env:
  NODE_VERSION: "22.x"

defaults:
  run:
    working-directory: ./react-frontend

jobs:
  # One job, one `npm ci` (#381). Each check is its own step, and every check
  # runs once the install succeeds, so one failing check does not hide the
  # others. The job fails if any of them fails.
  checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --legacy-peer-deps

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # Vitest unit/component tests. These need no backend stack, unlike the
      # Playwright E2E job below, so they run on every frontend change.
      - name: Unit tests with coverage
        id: unit_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Report exactly one file. `files` alone only adds to the action's
          # directory search, which otherwise also picks up other reporters'
          # output and uploads the same coverage twice.
          files: ./react-frontend/coverage/lcov.info
          disable_search: true
          # Flagged so frontend and backend stay separate numbers. A single
          # percentage blended across TypeScript and Python means nothing.
          flags: frontend
          fail_ci_if_error: true
          verbose: true

  # Playwright E2E requires a live FastAPI backend (Postgres, Redis, seeded admin,
  # CSRF-aware login). Image tags are aligned with compose/CI services (#37), but this
  # job still does not start the backend stack. Keep skipped until a dedicated
  # full-stack E2E workflow is added (follow-up under #30).
  e2e-tests:
    name: Frontend E2E Tests
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: react-frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: react-frontend/test-results/
          retention-days: 30
