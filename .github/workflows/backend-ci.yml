name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting with Black
        run: |
          cd backend
          # Use black with config from pyproject.toml
          black --check --config pyproject.toml .

      - name: Check imports with isort
        run: |
          cd backend
          # Use isort with config from pyproject.toml
          isort --check-only --settings-path pyproject.toml .

      - name: Lint with flake8
        run: |
          cd backend
          # Create a temporary flake8 config file that extends pyproject.toml settings
          echo "[flake8]" > .flake8
          echo "max-line-length = 110" >> .flake8
          echo "extend-ignore = E203" >> .flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Run full flake8 with configuration
          flake8 . --count --exit-zero --statistics

      - name: Type check with mypy
        run: |
          cd backend
          # Use mypy with config from pyproject.toml
          mypy --config-file pyproject.toml app

  test:
    name: Backend Test
    runs-on: ubuntu-latest
    # Set from the observed distribution, not a small sample: successful runs
    # range from 12 to 34 minutes. The first value here was 30, taken from six
    # runs whose maximum was 21, and it killed a healthy run on main at 90%
    # complete. 60 leaves real headroom over the worst observed run while still
    # catching a genuine hang six times sooner than GitHub's 360-minute default.
    #
    # The suite is slow because the in-process API tests in test/api/ boot the
    # app and do real database work per test. #212 gave them their own
    # directory so that cost is visible; it did not make them faster.
    timeout-minutes: 60
    services:
      postgres:
        # Keep in sync with backend docker-compose*.yml (postgres:15-alpine)
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # Keep in sync with backend docker-compose*.yml (redis:7.2-alpine)
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: testing_secret_key
      BACKEND_CORS_ORIGINS: '["http://localhost:8000", "http://localhost:5173"]'
      PROJECT_NAME: "FastAPI RBAC Test"
      TOKEN_ISSUER: "test_issuer"
      TOKEN_AUDIENCE: "test_audience"
      FIRST_SUPERUSER_EMAIL: "admin@example.com"
      FIRST_SUPERUSER_PASSWORD: "admin123"
      USER_CHANGED_PASSWORD_DATE: "2023-01-01T00:00:00" # Example date
      JWT_REFRESH_SECRET_KEY: "another_testing_secret_key"
      JWT_RESET_SECRET_KEY: "reset_testing_secret_key"
      ENCRYPT_KEY: "a_very_strong_encryption_key_32" # Must be 32 url-safe base64-encoded bytes

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run migrations
        run: |
          cd backend
          export PYTHONPATH=.
          alembic upgrade head

      - name: Test with pytest and coverage (unit tests only)
        run: |
          cd backend
          # test/api/ holds the in-process API tests. Same gate, same job: the
          # split is about what a reader should expect from each directory, not
          # about running them separately. See docs/adr/0012.
          pytest test/unit/ test/api/ --cov=app --cov-report=xml

      # Integration tests need Postgres, Redis and a live server, so they run in
      # the Docker test stack in the separate integration-test job below.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Report exactly one file. `files` alone only adds to the action's
          # directory search, which otherwise also picks up other reporters'
          # output and uploads the same coverage twice.
          files: ./backend/coverage.xml
          disable_search: true
          # Flagged so frontend and backend stay separate numbers. A single
          # percentage blended across TypeScript and Python means nothing.
          flags: backend
          fail_ci_if_error: true
          verbose: true

  integration-test:
    name: Backend Integration Test
    runs-on: ubuntu-latest
    # The suite takes ~9 minutes against the stack, plus the image build.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Provision the test environment file
        run: |
          cd backend
          # .env.test is git-ignored; the tracked template holds throwaway values.
          cp .env.test.example .env.test

      - name: Run integration tests in the Docker test stack
        run: |
          cd backend
          # --exit-code-from makes this step, and so the job, fail when pytest
          # fails inside the runner container. It also implies
          # --abort-on-container-exit, so the stack stops with the suite.
          # Local runs need a `down` first, because `up` reuses an exited runner
          # container and reports its stale exit code; here the runner is always
          # fresh.
          # SERVER_COVERAGE makes the app container run uvicorn under coverage.
          # The suite drives that container over HTTP, so app/ executes there and
          # not in the runner -- it is the only place integration coverage exists.
          # The data file is written by the flush step below, not by this one.
          SERVER_COVERAGE=1 docker compose -f docker-compose.test.minimal.yml up --build --exit-code-from fastapi_rbac_test_runner fastapi_rbac_test_runner

      - name: Dump stack logs on failure
        if: failure()
        run: |
          cd backend
          docker compose -f docker-compose.test.minimal.yml logs --no-color --tail=200

      # coverage writes its data file on USR1. The app container is still up at
      # this point: `up --exit-code-from` stops the runner but leaves this one
      # running, which is the window this step uses. Do not switch to relying on
      # shutdown -- uvicorn does not exit inside Docker's grace period, so the
      # container is SIGKILLed and coverage writes nothing.
      - name: Flush coverage from the app container
        run: |
          cd backend
          docker kill --signal=USR1 fastapi_rbac_test
          for i in $(seq 1 30); do
            [ -f .coverage.integration ] && break
            sleep 1
          done
          ls -l .coverage.integration

      # Deliberately not `if: always()`. When the suite fails, the job has
      # already reported the real problem; a missing coverage file on top of
      # that would bury it under a second, misleading error.
      - name: Convert integration coverage to XML
        run: |
          cd backend
          # Converted inside the image so the paths in the XML are the same
          # shape as the unit job's (app/...), which is what Codecov's path
          # fixing already resolves to backend/app/... correctly.
          docker compose -f docker-compose.test.minimal.yml run --rm --no-deps --entrypoint "" fastapi_rbac_test_runner coverage xml --data-file=/app/.coverage.integration -o /app/coverage-integration.xml
          ls -l coverage-integration.xml

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Report exactly one file. `files` alone only adds to the action's
          # directory search, which otherwise also picks up other reporters'
          # output and uploads the same coverage twice.
          files: ./backend/coverage-integration.xml
          # Same flag as the unit job on purpose: Codecov merges same-flag
          # reports, so `backend` becomes the real combined number and the
          # README badge stays meaningful. A separate flag could not be
          # badged as a backend total.
          flags: backend
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Tear down the test stack
        if: always()
        run: |
          cd backend
          docker compose -f docker-compose.test.minimal.yml down --volumes
