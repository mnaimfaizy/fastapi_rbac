name: Backend CI

# Called by ci.yml when a change touches the backend (#381); it has no
# trigger of its own. Run the whole pipeline by hand from CI > Run workflow.
on:
  workflow_call:

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # uv installs the same pinned requirements.txt as pip did, several times
      # faster, from a cache keyed on that file (#381).
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          uv pip install --system -r requirements.txt

      - name: Check formatting with Black
        run: |
          cd backend
          # Use black with config from pyproject.toml
          black --check --config pyproject.toml .

      - name: Check imports with isort
        run: |
          cd backend
          # Use isort with config from pyproject.toml
          isort --check-only --settings-path pyproject.toml .

      - name: Lint with flake8
        run: |
          cd backend
          # Create a temporary flake8 config file that extends pyproject.toml settings
          echo "[flake8]" > .flake8
          echo "max-line-length = 110" >> .flake8
          echo "extend-ignore = E203" >> .flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Run full flake8 with configuration
          flake8 . --count --exit-zero --statistics

      - name: Type check with mypy
        run: |
          cd backend
          # Use mypy with config from pyproject.toml
          mypy --config-file pyproject.toml app

  test:
    name: Backend Test
    runs-on: ubuntu-latest
    # The pytest step used to take ~22 minutes because every test rebuilt the
    # schema and re-ran the init_db seed (~2.7s of setup each). The fixtures
    # now build them once per session and isolate tests by rollback (see
    # test/fixtures/fixtures_db.py), and conftest.py lowers the bcrypt work
    # factor for the run. A local run of the same suite takes ~2.5 minutes.
    #
    # Left at 60 on purpose. An earlier value of 30 was taken from a small
    # sample and killed a healthy run on main at 90% complete. Tighten it only
    # once the new runtime has a real distribution behind it.
    timeout-minutes: 60
    services:
      postgres:
        # Keep in sync with backend docker-compose*.yml (postgres:15-alpine)
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # Keep in sync with backend docker-compose*.yml (redis:7.2-alpine)
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: testing_secret_key
      BACKEND_CORS_ORIGINS: '["http://localhost:8000", "http://localhost:5173"]'
      PROJECT_NAME: "FastAPI RBAC Test"
      TOKEN_ISSUER: "test_issuer"
      TOKEN_AUDIENCE: "test_audience"
      FIRST_SUPERUSER_EMAIL: "admin@example.com"
      USER_CHANGED_PASSWORD_DATE: "2023-01-01T00:00:00" # Example date
      JWT_REFRESH_SECRET_KEY: "another_testing_secret_key"
      JWT_RESET_SECRET_KEY: "reset_testing_secret_key"
      ENCRYPT_KEY: "a_very_strong_encryption_key_32" # Must be 32 url-safe base64-encoded bytes

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # uv installs the same pinned requirements.txt as pip did, several times
      # faster, from a cache keyed on that file (#381).
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          uv pip install --system -r requirements.txt pytest-cov

      - name: Run migrations
        run: |
          cd backend
          export PYTHONPATH=.
          alembic upgrade head

      - name: Test with pytest and coverage (unit tests only)
        run: |
          cd backend
          # test/api/ holds the in-process API tests. Same gate, same job: the
          # split is about what a reader should expect from each directory, not
          # about running them separately. See docs/adr/0012.
          pytest test/unit/ test/api/ --cov=app --cov-report=xml
          # Visible name: upload-artifact skips dotfiles unless told otherwise,
          # and the combine job must not guess at `.coverage`.
          cp .coverage coverage.unit.data

      # Integration tests need Postgres, Redis and a live server, so they run in
      # the Docker test stack in the separate integration-test job below.
      # Neither job uploads to Codecov: #236 showed that merging the two
      # Cobertura files under one backend flag produced impossible line data.
      # The Backend Coverage job combines the data files first.

      - name: Upload unit coverage data
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-unit
          path: |
            backend/coverage.unit.data
            backend/coverage.xml
          if-no-files-found: error
          retention-days: 7

  integration-test:
    name: Backend Integration Test
    runs-on: ubuntu-latest
    # The suite takes ~9 minutes against the stack, plus the image build.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Provision the test environment file
        run: |
          cd backend
          # .env.test is git-ignored; the tracked template holds throwaway values.
          cp .env.test.example .env.test

      # Build the stack's image here, with layer caching, instead of in
      # `compose up --build` (#381). Same Dockerfile, target, build args and
      # tag as docker-compose.test.minimal.yml, and the source is copied fresh
      # every time; only unchanged layers (apt packages, pip install of
      # requirements.txt) come from the cache. GitHub scopes the Actions cache
      # by branch: a pull request can read main's cache but writes only its
      # own, which main never reads, so a branch cannot poison main's layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          target: testing
          build-args: |
            NODE_ENV=testing
            ENVIRONMENT=testing
          tags: fastapi_rbac:test
          load: true
          cache-from: type=gha,scope=backend-test-image
          cache-to: type=gha,scope=backend-test-image,mode=min

      - name: Run integration tests in the Docker test stack
        run: |
          cd backend
          # --exit-code-from makes this step, and so the job, fail when pytest
          # fails inside the runner container. It also implies
          # --abort-on-container-exit, so the stack stops with the suite.
          # Local runs need a `down` first, because `up` reuses an exited runner
          # container and reports its stale exit code; here the runner is always
          # fresh.
          # SERVER_COVERAGE makes the app container run uvicorn under coverage.
          # The suite drives that container over HTTP, so app/ executes there and
          # not in the runner -- it is the only place integration coverage exists.
          # The data file is written by the flush step below, not by this one.
          # --no-build: the step above built fastapi_rbac:test, and compose
          # must fail rather than quietly build its own uncached copy.
          SERVER_COVERAGE=1 docker compose -f docker-compose.test.minimal.yml up --no-build --exit-code-from fastapi_rbac_test_runner fastapi_rbac_test_runner

      - name: Dump stack logs on failure
        if: failure()
        run: |
          cd backend
          docker compose -f docker-compose.test.minimal.yml logs --no-color --tail=200

      # coverage writes its data file on USR1. The app container is still up at
      # this point: `up --exit-code-from` stops the runner but leaves this one
      # running, which is the window this step uses. Do not switch to relying on
      # shutdown -- uvicorn does not exit inside Docker's grace period, so the
      # container is SIGKILLed and coverage writes nothing.
      - name: Flush coverage from the app container
        run: |
          cd backend
          docker kill --signal=USR1 fastapi_rbac_test
          for i in $(seq 1 30); do
            [ -f .coverage.integration ] && break
            sleep 1
          done
          ls -l .coverage.integration

      # Deliberately not `if: always()`. When the suite fails, the job has
      # already reported the real problem; a missing coverage file on top of
      # that would bury it under a second, misleading error.
      - name: Convert integration coverage to XML
        run: |
          cd backend
          # Converted inside the image so the XML is built against the same
          # tree the server traced. The combine job compares this file with
          # the unit job's XML, then unions the data files with coverage.py.
          docker compose -f docker-compose.test.minimal.yml run --rm --no-deps --entrypoint "" fastapi_rbac_test_runner coverage xml --data-file=/app/.coverage.integration -o /app/coverage-integration.xml
          cp .coverage.integration coverage.integration.data
          ls -l coverage-integration.xml coverage.integration.data

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-integration
          path: |
            backend/coverage.integration.data
            backend/coverage-integration.xml
          if-no-files-found: error
          retention-days: 7

      - name: Tear down the test stack
        if: always()
        run: |
          cd backend
          docker compose -f docker-compose.test.minimal.yml down --volumes

  # One backend upload. Codecov merging the two Cobertura files under the same
  # flag is what #236 caught: auth.py's login try-block listed later lines as
  # hit and earlier ones as miss, which is impossible if line identity matches.
  # coverage.py combine is a defined union of hits against one executable line
  # set. The shared `backend` flag stays so the README badge remains one number
  # (#222); splitting flags is out of scope.
  coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    # Explicit, so a skipped or failed suite skips the combine as before.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.integration-test.result == 'success' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install coverage.py at the pinned version
        run: |
          cd backend
          python -m pip install --upgrade pip
          # Python 3.10 has no tomllib; coverage reads pyproject.toml via tomli.
          coverage_pin=$(grep -E '^coverage==' requirements.txt | sed 's/coverage==/coverage[toml]==/')
          pip install "$coverage_pin"

      - name: Download unit coverage data
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-unit
          # upload-artifact strips the shared `backend/` prefix, so these
          # files are flat (coverage.xml, coverage.unit.data). Put them
          # back under backend/ where combine and the comparer run.
          path: backend

      - name: Download integration coverage data
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-integration
          path: backend

      - name: Compare executable line sets then combine
        run: |
          cd backend
          ls -l coverage.xml coverage-integration.xml coverage.unit.data coverage.integration.data
          # Diagnostic for #236: log whether the two original XMLs agree about
          # which lines exist. Hits may differ; that is why we combine. Exit 1
          # is a line-set mismatch (warn, still upload). Any other non-zero
          # is a missing file or a crash and must fail the job.
          set +e
          python test/cobertura_compare.py coverage.xml coverage-integration.xml --file app/api/v1/endpoints/auth.py
          compare_rc=$?
          set -e
          if [ "$compare_rc" -eq 1 ]; then
            echo "::warning::Original unit and integration XMLs disagree about executable lines in auth.py. Uploading the coverage.py combine anyway."
          elif [ "$compare_rc" -ne 0 ]; then
            exit "$compare_rc"
          fi
          coverage combine coverage.unit.data coverage.integration.data
          coverage xml -o coverage-combined.xml
          ls -l coverage-combined.xml

      # Dependabot runs get no Actions secrets, and Codecov refuses a tokenless
      # upload here ("Token required because branch is protected").
      - name: Upload combined coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage-combined.xml
          disable_search: true
          # The CLI's pycoverage plugin regenerates coverage.xml from any
          # `.coverage` it finds. That would upload a second, differently
          # pathed report of the same data — the shape #236 was about.
          plugins: noop
          flags: backend
          fail_ci_if_error: true
          verbose: true
