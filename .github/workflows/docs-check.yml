name: Docs Check

# Starts on every pull request. The explainer check runs when an explainer, its rules, or the code
# an explainer cites (backend/app, react-frontend/src) changes; the MkDocs build when docs/ or
# mkdocs.yml changes (#381).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's run still in progress. Pushes
# to main get a group of their own (the run id), so they never queue behind
# or cancel each other (#381).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the jobs below when the change cannot affect the docs or the code
  # an explainer cites (#381). A job skipped by `if` reports Success, so the
  # required checks still resolve on a docs-only PR. If this job fails,
  # everything runs instead (fail open).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      explainers: ${{ steps.detect.outputs.explainers }}
      mkdocs: ${{ steps.detect.outputs.mkdocs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: detect
        uses: ./.github/actions/detect-changes

  explainers:
    name: Explainer pages match the code
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.explainers == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a failure can show the diff inside each cited range.
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Test the checker
        run: python -m unittest discover -s scripts/docs -p "test_*.py"

      - name: Check explainer pages against the code
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base=()
          if [ -n "$BASE_REF" ] && ! [[ "$BASE_REF" =~ ^0+$ ]]; then base=(--base "$BASE_REF"); fi
          python scripts/docs/check_explainers.py --github "${base[@]}"

  build:
    name: MkDocs build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mkdocs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build

      - name: Explainer pages are in the build
        run: |
          missing=0
          for page in docs/explainers/*.html; do
            built="site/explainers/$(basename "$page")"
            if [ ! -f "$built" ]; then
              echo "::error file=$page::$page is not in the MkDocs build (expected $built)"
              missing=1
            fi
          done
          exit $missing
