# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# `pre-commit install` installs all four. post-commit, post-merge and
# post-rewrite only run the graphify refresh, which is a no-op unless you opted
# in to graphify (docs/agents/graphify.md).
default_install_hook_types: [pre-commit, post-commit, post-merge, post-rewrite]
# Hooks without their own `stages` run at commit time only, not after commits
# or merges.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^react-frontend/
      - id: end-of-file-fixer
        exclude: ^react-frontend/
      - id: check-yaml
        exclude: ^react-frontend/
      - id: check-added-large-files
        exclude: ^react-frontend/
  - repo: https://github.com/psf/black
    rev: 25.12.0 # Keep in sync with backend/requirements.txt
    hooks:
      - id: black
        files: ^backend/
        exclude: >
          (?x)(
            ^react-frontend/|
            ^.venv/|
            ^venv/|
            ^.env/|
            ^__pycache__/|
            ^.git/|
            ^alembic/|
            ^.pytest_cache/|
            ^.mypy_cache/
          )
  - repo: https://github.com/pycqa/isort
    rev: 6.1.0 # Keep in sync with backend/requirements.txt
    hooks:
      - id: isort
        files: ^backend/
        args: ["--settings-path=backend/pyproject.toml"] # Use pyproject.toml for settings
        exclude: >
          (?x)(
            ^react-frontend/|
            ^.venv/|
            ^venv/|
            ^.env/|
            ^__pycache__/|
            ^.git/|
            ^alembic/|
            ^.pytest_cache/|
            ^.mypy_cache/
          )
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0 # Keep in sync with backend/requirements.txt
    hooks:
      - id: flake8
        files: ^backend/
        args:
          [
            "--config=backend/.flake8",
            "--extend-ignore=F403,F405,E402,F541,E203,W503",
            "--per-file-ignores=backend/app/models/__init__.py:F401,F403 backend/alembic/env.py:F401,E402,F403 backend/app/api/v1/endpoints/login.py:E501 backend/app/crud/user_crud.py:E501 backend/app/db/session.py:E501 backend/app/main.py:E501 backend/app/utils/background_tasks.py:E501 backend/app/utils/email/email.py:E501 backend/app/core/service_config.py:E501 backend/app/api/deps.py:E501 backend/app/tests/test_email.py:E501",
          ]
        exclude: >
          (?x)(
            ^react-frontend/|
            ^.venv/|
            ^venv/|
            ^.env/|
            ^__pycache__/|
            ^.git/|
            ^backend/alembic/versions/|
            ^.pytest_cache/|
            ^.mypy_cache/
          )
  # Replace local mypy hook with the standard one
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2 # Keep in sync with backend/requirements.txt
    hooks:
      - id: mypy
        files: ^backend/ # Ensure it only runs on backend code
        exclude: >
          (?x)(
            ^react-frontend/|
            ^.venv/|
            ^venv/|
            ^.env/|
            ^__pycache__/|
            ^.git/|
            ^backend/alembic/|
            ^.pytest_cache/|
            ^.mypy_cache/
          )
        args: # Keep your existing arguments
          [
            "--ignore-missing-imports",
            "--disable-error-code=import-not-found",
            "--disable-error-code=name-defined",
            "--disable-error-code=attr-defined",
            "--disable-error-code=assignment",
            "--disable-error-code=valid-type",
            "--disable-error-code=union-attr",
            "--disable-error-code=arg-type",
            "--disable-error-code=index",
            "--disable-error-code=return-value",
            "--disable-error-code=misc",
            "--disable-error-code=call-arg",
            "--disable-error-code=override",
            "--disable-error-code=call-overload",
            "--disable-error-code=unreachable",
            "--no-warn-no-return",
            "--no-warn-return-any",
            "--no-strict-optional",
            "--config-file=backend/mypy.ini", # Point to your mypy config
          ]
        # If mypy needs dependencies from your project, add them here:
        additional_dependencies: ["types-bleach==6.2.0.20250514"]
  # Explainer pages (docs/explainers/) cite source lines and state source values.
  # Fail the commit when a change makes one of them wrong. See docs/explainers/README.md.
  - repo: local
    hooks:
      - id: explainer-drift
        name: explainer pages match the code
        entry: python scripts/docs/check_explainers.py
        language: python
        pass_filenames: false
        files: ^(backend/app/|react-frontend/src/|docs/explainers/|scripts/docs/)
  # Refresh the local graphify graph after commits and merges/pulls that touch
  # source. Runs in the background and never fails the git command. No-op for
  # anyone without graphify installed and a graph built. See docs/agents/graphify.md.
  - repo: local
    hooks:
      - id: graphify-refresh-commit
        name: graphify refresh (commit)
        entry: scripts/development/graphify/graphify-refresh.sh commit
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        verbose: true
      - id: graphify-refresh-merge
        name: graphify refresh (merge/pull)
        entry: scripts/development/graphify/graphify-refresh.sh merge
        language: script
        stages: [post-merge]
        always_run: true
        pass_filenames: false
        verbose: true
      - id: graphify-refresh-rewrite
        name: graphify refresh (rebase/pull --rebase)
        entry: scripts/development/graphify/graphify-refresh.sh rewrite
        language: script
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false
        verbose: true
