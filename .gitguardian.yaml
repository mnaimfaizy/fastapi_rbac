# GitGuardian configuration.
#
# The tracked `.env*.example` files are templates of throwaway credentials for
# disposable local and test containers -- `.env.example`,
# `.env.production.example` and `.env.test.example` all carry a placeholder
# ENCRYPT_KEY and `DATABASE_PASSWORD=postgres`. They are not secrets, and the
# real `.env*` files they seed stay git-ignored.
version: 2

secret:
  ignored-paths:
    - "**/.env.example"
    - "**/.env.*.example"
