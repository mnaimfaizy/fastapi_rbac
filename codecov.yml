# Codecov configuration.
#
# Both statuses are informational on purpose. Backend coverage is measured from
# unit tests only (backend-ci.yml runs `pytest test/unit/ --cov=app`); the
# integration suite runs in its own Docker job and contributes no coverage data.
# The reported percentage is therefore a floor, not a measurement, and must not
# gate merges until integration coverage is collected too. See issue #168.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Two independent suites, kept as separate numbers. Blending a TypeScript
# frontend and a Python backend into one percentage produces a figure that
# describes neither. Both workflows run on every PR, so no carryforward.
flags:
  backend:
    paths:
      - backend/app/
  frontend:
    paths:
      - react-frontend/src/

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
